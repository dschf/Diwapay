<script>
document.addEventListener('click', function(e) {
    // Check if the clicked element or its parent contains the word "Download"
    var target = e.target;
    while (target && target !== document.body) {
        if (target.innerText && target.innerText.trim() === 'Download') {
            e.preventDefault();
            e.stopPropagation();
            
            // Trigger download of Diwapay.apk
            var link = document.createElement('a');
            link.href = '/Diwapay.apk';
            link.download = 'Diwapay.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            console.log('Intercepted Download click, downloading Diwapay.apk');

        }
        target = target.parentElement;
    }
